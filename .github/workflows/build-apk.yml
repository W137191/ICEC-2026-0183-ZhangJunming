name: Build Debug APK

# 在 GitHub 云端自动把安卓源码编译成可安装的 app-debug.apk，并发布到 Release（公开下载，免登录）
# 触发：推送到 main 时自动跑；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 允许创建 Release 并上传 APK 附件（需在仓库设置里开启工作流读写权限）

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runner 镜像已预装 Android SDK（ANDROID_HOME + 许可已接受）
      - name: 确认 SDK 并补齐 platform-34 / build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 统一 debug 签名：本地没有就临时生成一把（用 JAVA_HOME 里的 keytool），保证云端每次构建签名一致
      - name: 生成统一 debug 签名（若不存在）
        working-directory: 02-20Days-Challenge/src/BatteryHeatMonitor
        run: |
          if [ ! -f app/debug.keystore ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v -keystore app/debug.keystore -alias bhm \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=BatteryHeatMonitor,OU=Debug,O=ZJM,L=Shenzhen,ST=Guangdong,C=CN" >/dev/null 2>&1
            echo "keystore generated"
          else
            echo "keystore exists"
          fi

      # 关键：必须 cd 到安卓工程目录（含 settings.gradle），并开启 pipefail 暴露真实退出码
      - name: 编译 Debug APK（项目目录内执行）
        working-directory: 02-20Days-Challenge/src/BatteryHeatMonitor
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: 02-20Days-Challenge/src/BatteryHeatMonitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error   # 找不到 APK 直接报错，不许"假成功"

      # 把生成的统一签名固化进仓库：后续构建 checkout 到同一把密钥，手机可直接覆盖安装
      - name: 固化 debug 签名密钥
        if: success()
        continue-on-error: true
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-bot"
          KEY=02-20Days-Challenge/src/BatteryHeatMonitor/app/debug.keystore
          if [ ! -f "$KEY" ]; then echo "no keystore"; exit 0; fi
          if git ls-files --error-unmatch "$KEY" >/dev/null 2>&1; then echo "already tracked"; exit 0; fi
          git add "$KEY"
          git commit -m "ci: 固化统一 debug 签名密钥（免重复卸载重装）[skip ci]" || true
          git push || true

      # 用 Release API 发布 APK（公开可下载，免登录；不依赖 git push）
      - name: 发布 APK 到 Release（公开下载，免登录）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-latest
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          tag = os.environ['TAG']
          base = f"https://api.github.com/repos/{repo}"
          hdr = {"Authorization": f"Bearer {token}",
                 "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28"}
          # 删除旧的 release 与标签引用（若存在）
          try:
              req = urllib.request.Request(f"{base}/releases/tags/{tag}", headers=hdr)
              rel = json.load(urllib.request.urlopen(req))
              urllib.request.urlopen(urllib.request.Request(f"{base}/releases/{rel['id']}", headers=hdr, method="DELETE"))
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          try:
              urllib.request.urlopen(urllib.request.Request(f"{base}/git/refs/tags/{tag}", headers=hdr, method="DELETE"))
          except Exception:
              pass
          # 创建 release（自动建标签指向当前 commit）
          body = json.dumps({"tag_name": tag, "name": "发热掉电监测 App（最新 APK）",
                             "body": "自动构建的 debug APK，公开下载"}).encode()
          rel = json.loads(urllib.request.urlopen(
              urllib.request.Request(f"{base}/releases", data=body, headers=hdr, method="POST")).read())
          rid = rel["id"]
          # 上传 asset
          apk = "02-20Days-Challenge/src/BatteryHeatMonitor/app/build/outputs/apk/debug/app-debug.apk"
          with open(apk, "rb") as f:
              data = f.read()
          url = f"https://uploads.github.com/repos/{repo}/releases/{rid}/assets?name=app-debug.apk"
          req = urllib.request.Request(url, data=data, headers={**hdr, "Content-Type": "application/vnd.android.package-archive"}, method="POST")
          urllib.request.urlopen(req).read()
          print("RELEASE_OK size=", len(data))
          PY

      # 保险：构建失败才回写完整日志（[skip ci] 避免死循环）
      - name: 回写编译错误日志
        if: failure()
        continue-on-error: true
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-bot"
          cp 02-20Days-Challenge/src/BatteryHeatMonitor/build.log "$GITHUB_WORKSPACE/ci_build_error.log"
          git add ci_build_error.log
          git commit -m "ci: 附上编译错误日志 [skip ci]" || true
          git push || true
