name: Build Debug APK

# 在 GitHub 云端自动把安卓源码编译成可安装的 app-debug.apk
# 触发：推送到 main 时自动跑；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 允许把编译错误日志回写仓库用于排查（正常成功时不触发）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runner 镜像已预装 Android SDK（ANDROID_HOME + 许可已接受），
      # 不再使用 android-actions/setup-android@v3（在新镜像上会挂）。
      - name: 确认 SDK 并补齐 platform-34 / build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 把 APK 提交进仓库（强制 add，绕过 *.apk 忽略），生成公开 raw 链接，免登录即可下载
      - name: 提交 APK 到仓库（公开可下载，免登录）
        if: success()
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-bot"
          mkdir -p 02-20Days-Challenge/src/BatteryHeatMonitor/release
          cp 02-20Days-Challenge/src/BatteryHeatMonitor/app/build/outputs/apk/debug/app-debug.apk 02-20Days-Challenge/src/BatteryHeatMonitor/release/app-debug.apk
          git add -f 02-20Days-Challenge/src/BatteryHeatMonitor/release/app-debug.apk
          git commit -m "ci: 发布 app-debug.apk 到仓库（免登录下载）[skip ci]" || true
          git push || true

      # 保险：构建失败才把完整日志回写仓库（[skip ci] 避免死循环），便于定位
      - name: 回写编译错误日志
        if: failure()
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-bot"
          cp build.log "$GITHUB_WORKSPACE/ci_build_error.log"
          git add ci_build_error.log
          git commit -m "ci: 附上编译错误日志 [skip ci]" || true
          git push || true
